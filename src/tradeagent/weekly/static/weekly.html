<body><header><a href="./">TradeAgent</a><span>SHADOW · PAPER ONLY</span><a href="weekly.json">完整数据 JSON ↗</a></header>
<main><p class="eyebrow">WEEKLY-HOLD-V1 / 周度持仓研究</p><h1>让每一周的选择，<br>留下完整的记录。</h1><p class="intro">五个独立的 $10,000 模拟账户。相同股票池，决策先冻结，交易后计分。盈利、亏损和缺失全部保留。</p><div class="notice" id="status">读取前瞻记录…</div>

<section><h2>周度净收益</h2><div class="scroll"><table id="weeks"></table></div></section>

<section><h2>冻结决策与来源</h2><div id="decisions"></div></section>
<section><h2>缺失与延迟记录</h2><div id="issues"></div></section>
