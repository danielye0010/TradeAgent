<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TradeAgent</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-row">
    <a class="wordmark" href="#/home" aria-label="TradeAgent home">TradeAgent</a>
    <p class="pulse" id="pulse" role="status" aria-live="polite"></p>
    <div class="tools">
      <button type="button" class="tool" id="lang" aria-label="Language"></button>
      <button type="button" class="tool" id="updown" aria-label="Gain and loss colors"></button>
      <button type="button" class="tool" id="theme" aria-label="Theme"></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main" tabindex="-1"></main>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title">
  <div class="drawer-panel">
    <button type="button" class="drawer-close" id="drawer-close"></button>
    <div id="drawer-body"></div>
  </div>
</aside>
<footer class="foot" id="foot"></footer>
<script src="/app.js"></script>
</body>
</html>
