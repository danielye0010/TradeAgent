name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Offline tests
        run: python -m pytest -q
      - name: Style and imports
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m compileall -q src
          python -c "import robinhood_agent"
      - name: Package
        run: |
          python -m build
          python -m twine check dist/*
      - name: Project integrity
        run: python scripts/check_project.py
      - name: Synthetic quickstart
        run: |
          robinhood-agent validate
          robinhood-agent simulate --demo-dir work/ci-demo > work/ci-demo-output.json
          robinhood-agent inspect --config work/ci-demo/inspect.example.json
