name: Publish to PyPI

# Runs when a GitHub release is published from a v* tag. Uses PyPI Trusted
# Publishing (OIDC): no PyPI password or API token is stored anywhere.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tradeagent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install build==1.3.0 twine==6.2.0 packaging
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Release metadata and content
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME" --dist dist
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
