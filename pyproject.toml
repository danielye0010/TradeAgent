[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeagent"
version = "0.2.1"
description = "Prospective quantitative strategy research, daily learning, champion/challenger evolution, and durable broker execution."
readme = "README.md"
license = "Apache-2.0 AND MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

requires-python = ">=3.12"
dependencies = ["exchange-calendars==4.13.2", "jsonschema==4.26.0"]
license-files = ["LICENSE", "licenses/*.txt"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "build==1.3.0", "twine==6.2.0"]

[project.urls]
Source = "https://github.com/danielye0010/TradeAgent"
Issues = "https://github.com/danielye0010/TradeAgent/issues"
Documentation = "https://github.com/danielye0010/TradeAgent/tree/main/docs"

[project.scripts]
tradeagent = "tradeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradeagent = ["contracts/*.json", "owner.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=work/test-runtime"

[tool.ruff]
line-length = 100
exclude = ["src/tradeagent/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

