[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "A Python trading system for simulation, shadow trading, and controlled live execution."
readme = "README.md"
license = "Apache-2.0 AND MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

requires-python = ">=3.12"
dependencies = ["exchange-calendars==4.13.2", "jsonschema==4.26.0"]
license-files = ["LICENSE", "licenses/*.txt"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "build==1.3.0", "twine==6.2.0"]

[project.urls]
Source = "https://github.com/danielye0010/tradebot"
Issues = "https://github.com/danielye0010/tradebot/issues"
Documentation = "https://github.com/danielye0010/tradebot/tree/main/docs"

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradebot = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=work/test-runtime"

[tool.ruff]
line-length = 100
exclude = ["src/tradebot/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

