[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeagent"
version = "1.7.2"
description = "An AI analyst picks the trade; tested Python places it on Robinhood with hard limits and an automatic exit."
readme = "README.md"
authors = [{ name = "Daniel Ye" }]
keywords = ["trading", "robinhood", "mcp", "codex", "ai-agent", "quant", "paper-trading"]
license = "Apache-2.0 AND MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

requires-python = ">=3.12"
dependencies = ["exchange-calendars==4.13.2", "jsonschema==4.26.0"]
license-files = ["LICENSE", "licenses/*.txt"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "ruff==0.16.10", "build==1.3.0", "twine==6.2.0"]

[project.urls]
Homepage = "https://github.com/danielye0010/TradeAgent"
Changelog = "https://github.com/danielye0010/TradeAgent/blob/main/CHANGELOG.md"
Source = "https://github.com/danielye0010/TradeAgent"
Issues = "https://github.com/danielye0010/TradeAgent/issues"
Documentation = "https://github.com/danielye0010/TradeAgent/tree/main/docs"

[project.scripts]
tradeagent = "tradeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradeagent = ["contracts/*.json", "owner.example.toml", "dashboard/static/*", "site/*", "weekly/*.json", "weekly/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=work/test-runtime"

[tool.ruff]
line-length = 100
exclude = ["src/tradeagent/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
